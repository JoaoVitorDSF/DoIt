<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - DoIt!</title>
    <link rel="stylesheet" href="/dashboard/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1 class="logo">DoIt!</h1>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-item active">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                    <span>Dashboard</span>
                </div>
                <div class="nav-item" id="settingsBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                    <span>Configurações</span>
                </div>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">
                        <img id="profileImage" src="" alt="Profile" style="display: none; width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">
                        <svg id="defaultAvatar" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </div>
                    <div class="user-details">
                        <span class="user-name" id="userName">Usuário</span>
                        <span class="user-email" id="userEmail">usuario@email.com</span>
                    </div>
                </div>
                <button class="logout-btn" id="logoutBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    <span>Sair</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="dashboard-main">
            <!-- Create Task Section -->
            <section class="create-task-section">
                <button class="btn-create-task" id="createTaskBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    Criar Nova Tarefa
                </button>
            </section>

            <!-- Tasks List -->
            <section class="tasks-section">
                <h2 class="tasks-title">Minhas Tarefas</h2>
                <div class="tasks-container" id="tasksContainer">
                    <!-- Tasks will be loaded here dynamically -->
                </div>
            </section>
        </main>
    </div>

    <!-- Create Task Modal -->
    <div class="modal" id="createTaskModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Criar Nova Tarefa</h2>
                <button class="modal-close" id="closeModal">&times;</button>
            </div>
            <form id="createTaskForm">
                <div class="form-group">
                    <label for="taskName">Nome da Tarefa</label>
                    <input type="text" id="taskName" name="taskName" required placeholder="Digite o nome da tarefa">
                </div>
                <div class="form-group">
                    <label for="taskFunction">Função/Descrição</label>
                    <input type="text" id="taskFunction" name="taskFunction" required placeholder="Descreva a função (máx. 50 caracteres)" maxlength="50">
                </div>
                <div class="form-group">
                    <label for="taskStartDate">Data de Início</label>
                    <input type="date" id="taskStartDate" name="taskStartDate" required>
                </div>
                <div class="form-group">
                    <label for="taskExpiryDate">Data de Expiração</label>
                    <input type="date" id="taskExpiryDate" name="taskExpiryDate" required>
                </div>
                <button type="submit" class="btn-primary">Criar Tarefa</button>
            </form>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Configurações</h2>
                <button class="modal-close" id="closeSettingsModal">&times;</button>
            </div>
            <div class="settings-content">
                <div class="setting-item">
                    <label for="theme">Tema</label>
                    <select id="theme" name="theme">
                        <option value="light">Claro</option>
                        <option value="dark">Escuro</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label for="language">Idioma</label>
                    <select id="language" name="language">
                        <option value="pt-BR">Português</option>
                        <option value="en">English</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label for="profileImageUpload">Foto de Perfil</label>
                    <input type="file" id="profileImageUpload" accept="image/*" style="display: none;">
                    <button type="button" class="btn-secondary" id="selectProfileImageBtn">Selecionar Imagem</button>
                    <div id="profileImagePreview" style="margin-top: 10px; display: none;">
                        <img id="previewImg" src="" alt="Preview" style="max-width: 100px; max-height: 100px; border-radius: 50%; object-fit: cover;">
                        <button type="button" class="btn-danger" id="removeProfileImageBtn" style="margin-left: 10px;">Remover</button>
                    </div>
                    <div id="cropperContainer" style="margin-top: 10px; display: none;">
                        <img id="cropperImage" src="" alt="Crop Image" style="max-width: 100%; max-height: 400px;">
                        <div style="margin-top: 10px; display: flex; gap: 10px;">
                            <button type="button" class="btn-secondary" id="confirmCropBtn">Confirmar Recorte</button>
                            <button type="button" class="btn-danger" id="cancelCropBtn">Cancelar</button>
                        </div>
                    </div>
                </div>
                <button class="btn-primary" id="saveSettings">Salvar Configurações</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script type="module" src="/dist/common.js"></script>
    <script type="module" src="/dist/dashboard.js"></script>
</body>
</html>
